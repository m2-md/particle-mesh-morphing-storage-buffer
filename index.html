<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tek Çekirdek, İki Shader — TSL compute ile mesh morph'u</title>
  </head>
  <body>
    <main>
      <h1>Tek çekirdek, iki shader</h1>
      <p class="lede">
        Parçacık konumları GPU'da bir <code>instancedArray</code> içinde yaşıyor. Aynı TSL kernel'ı
        WebGPU'da <code>var&lt;storage, read_write&gt;</code>, WebGL2'de transform feedback +
        <code>texelFetch</code> olarak derleniyor.
      </p>

      <div class="stage-box">
        <canvas id="stage"></canvas>
      </div>

      <div class="controls">
        <div class="control" id="count">
          <span class="label">Parçacık</span>
          <button data-count="100000" class="active">100k</button>
          <button data-count="200000">200k</button>
          <button data-count="500000">500k</button>
        </div>

        <div class="control">
          <span class="label">Morph</span>
          <button id="morph">Küre ⇄ Burgu düğümü</button>
        </div>

        <div class="control">
          <span class="label">Eş bağı</span>
          <select id="bond">
            <option value="off">Kapalı</option>
            <option value="on" selected>Açık</option>
            <option value="broken">Açık (PBO'suz)</option>
          </select>
        </div>

        <div class="control">
          <span class="label">Çözünürlük ölçeği</span>
          <select id="scale">
            <option value="0.35">0,35</option>
            <option value="0.5" selected>0,50</option>
            <option value="0.75">0,75</option>
            <option value="1">1,00</option>
          </select>
        </div>

        <div class="control">
          <button id="toggle">Dur</button>
          <a id="backend" href="?backend=webgl2">Backend</a>
        </div>
      </div>

      <div id="hud"></div>
      <p id="measure-status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
