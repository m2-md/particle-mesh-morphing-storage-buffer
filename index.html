<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Particle Mesh-to-Mesh Morphing with WebGPU TSL Compute</title>
  </head>
  <body>
    <main>
      <h1>One Kernel, Two Shaders</h1>
      <p class="lede">
        Particle positions reside on GPU inside an <code>instancedArray</code>. The same TSL kernel
        compiles to <code>var&lt;storage, read_write&gt;</code> in WebGPU, and to transform feedback +
        <code>texelFetch</code> in WebGL2.
      </p>

      <div class="stage-box">
        <canvas id="stage"></canvas>
      </div>

      <div class="controls">
        <div class="control" id="count">
          <span class="label">Particles</span>
          <button data-count="100000" class="active">100k</button>
          <button data-count="200000">200k</button>
          <button data-count="500000">500k</button>
        </div>

        <div class="control">
          <span class="label">Morph</span>
          <button id="morph">Sphere ⇄ Trefoil knot</button>
        </div>

        <div class="control">
          <span class="label">Pair bond</span>
          <select id="bond">
            <option value="off">Off</option>
            <option value="on" selected>On</option>
            <option value="broken">On (No PBO)</option>
          </select>
        </div>

        <div class="control">
          <span class="label">Resolution scale</span>
          <select id="scale">
            <option value="0.35">0.35</option>
            <option value="0.5" selected>0.50</option>
            <option value="0.75">0.75</option>
            <option value="1">1.00</option>
          </select>
        </div>

        <div class="control">
          <button id="toggle">Pause</button>
          <a id="backend" href="?backend=webgl2">Backend</a>
        </div>
      </div>

      <div id="hud"></div>
      <p id="measure-status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
